<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission to Mars</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    <style>

        header, footer{
            font-family: "Orbitron", "Stack Sans Text", sans-serif;
            color: #FF9D0C;
            font-size: 150%;
            text-align: center;
        }

        body{
            background: linear-gradient(0deg, #8100CB,#210062, #05002C);
            min-width: 100vw;
            min-height: 100vh;
        }

        img{
            max-width: 100%;
            max-height: auto;
            display: block;
        }

        .boxContainer{
            position: relative;
            display: grid;
            max-width: 1280px;
            max-height: 1280px;
            margin: auto auto;
            gap: 15px;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        .box{
            border-radius: 16px;
            border: 2px solid white;
        }

        .box:hover{
            background-color: gray;
            transform: scale(1.2);
        }

        .boxBig{
            grid-column: span 2;
            grid-row: span 2;
        }

        .boxMedium{
            grid-column: span 2;
            grid-row: span 1;
         
        }

        .boxSmall{
            grid-column: span 1;
            grid-row: span 1;
       
        }

        .titleBox{
            color: #FF9D0C;
            font-size: 200%;
            font-family: "Orbitron", sans-serif;
            text-align: center;
        }

        .subTitleBox{
            color: white;
            font-family: "Sans Stack Text", sans-serif;
            font-size: 200%;
            text-align: center;
            line-height: 1.5;
        }

        .tabIndent{
            display: inline-block;
            width: 200px;
            text-align: left;
        }

        @media(max-width: 800px){
            .boxContainer{
                grid-template-rows: auto;
            }

            .boxBig{
                grid-column: span 4;
                grid-row: auto;
            }

            .boxMedium{
                grid-column: span 2;
                grid-row: span 2;
            }

            .boxSmall{
                grid-column: span 1;
                grid-row: span 1;
            }
        }


    </style>
</head>
<body>
    <header>
        <h1>Mission to Mars</h1>
    </header>

    <main class="boxContainer">
        <article class="box boxBig">
            <h1 class="titleBox">
                Main Dashboard
            </h1>
            <p class="subTitleBox">
                Mission Status: GO!
            </p>
            <img style="display: block; margin: 0 auto;" src="https://placehold.co/450x350/2a2a2a/ffffff?text=Live+Feed" alt="Live Feed Placeholder">
        </article>

        <article class ="box boxMedium">
            <h1 class="titleBox">
                Rocket Telemetry
            </h1>
            <p class="subTitleBox" style="margin-left: 10px; text-align: left;">
                <span class="tabIndent">Speed</span><span class="tabIndent">: 12 km/s</span><br>
                <span class="tabIndent">Altitude</span><span class="tabIndent">: 367 km</span><br>
                <span class="tabIndent">Fuel</span><span class="tabIndent">: 87%</span> 
            </p>

        </article>

        <section class="box boxSmall">
            <h1 class="titleBox">
                Crew Status
            </h1>
            <p class="subTitleBox">
                4 Astronauts - All Nominal
            </p>

        </section>

        <section class="box boxSmall">
            <h1 class="titleBox">
                Countdown Timer
            </h1>
            <p class="subTitleBox">
                Time Elapsed: 00:30:45
            </p>

        </section>

        <article class ="box boxMedium">
            <h1 class="titleBox">
                Mars Rover Location
            </h1>
            <img style="display: block; margin: 0 auto; aspect-ratio: 1/1; width: 200px; height: auto;" src="https://cdn-icons-png.flaticon.com/512/5720/5720082.png" alt="Map Placeholder">
  
        </article>

        <section class="box boxSmall">
            <h1 class="titleBox">
                Weather on Mars
            </h1>
            <p class="subTitleBox">
                Temp: -63°C
            </p>

        </section>

    </main>

    <footer>
        <h1>
            Let's Go GMAT!
        </h1>
    </footer>

</body>
</html>
